! ==========================================
! Router 1 Configuration (Core / Gateway)
! Copy and paste into Router1 CLI in GNS3
! ==========================================
enable
configure terminal

hostname Router1
ip domain-name lab.local

! Generate RSA Key for SSH (1024 or 2048 bits)
crypto key generate rsa modulus 1024

! Local Admin User (Privilege 15)
username admin privilege 15 secret admin123

! Enable SSH v2 on VTY Lines
line vty 0 4
 transport input ssh
 login local
 exec-timeout 0 0
 exit

! Interface towards Host / GNS3 Cloud NAT (DHCP or Static)
interface GigabitEthernet0/0
 description Connected to Host / NAT
 ip address 192.168.122.101 255.255.255.0
 no shutdown
 exit

! Interface towards Router 2
interface GigabitEthernet0/1
 description Link to Router2
 ip address 10.0.0.1 255.255.255.0
 no shutdown
 exit

! Loopback Interface for Telemetry Identification
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
 no shutdown
 exit

! Routing (OSPF)
router ospf 1
 router-id 1.1.1.1
 network 10.0.0.0 0.0.0.255 area 0
 network 1.1.1.0 0.0.0.255 area 0
 exit

end
write memory
